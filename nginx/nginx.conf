events {}

http {
    server {
        listen 80;
        server_name bbangpatrol.duckdns.org;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        server_name bbangpatrol.duckdns.org;

        ssl_certificate     /etc/letsencrypt/live/bbangpatrol.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bbangpatrol.duckdns.org/privkey.pem;

        client_max_body_size 20M;    # 영수증 이미지 업로드

        location / {
            proxy_pass http://backend:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 120s;   # ocr.read-timeout=60s 보다 넉넉히
            proxy_send_timeout 120s;
        }
    }
}