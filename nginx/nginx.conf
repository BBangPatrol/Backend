events {}

http {
    # 운영/개발 백엔드는 compose 프로젝트가 달라 도커 네트워크가 갈린다.
    # 서비스 이름(backend)은 두 네트워크에 똑같이 있으므로 이름 대신 호스트 포트로 붙는다
    upstream bbang_prod { server 127.0.0.1:8080; }
    upstream bbang_dev  { server 127.0.0.1:8081; }

    server {
        listen 80;
        server_name bbangpatrol.duckdns.org dev.bbangpatrol.duckdns.org;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        server_name bbangpatrol.duckdns.org;

        ssl_certificate     /etc/letsencrypt/live/bbangpatrol.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bbangpatrol.duckdns.org/privkey.pem;

        # 리뷰 사진 3장(장당 최대 15MB) + 영수증 이미지.
        # Spring 의 max-request-size(60MB) 보다 높게 둔다. nginx 가 먼저 끊으면
        # 앱의 JSON 에러 대신 nginx 의 HTML 413 이 나가기 때문이다.
        client_max_body_size 70M;

        location / {
            proxy_pass http://bbang_prod;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 120s;   # ocr.read-timeout=60s 보다 넉넉히
            proxy_send_timeout 120s;
        }
    }

    # 개발 서버. 인증서는 따로 받는다: certbot certonly --webroot -w /var/www/certbot -d dev.bbangpatrol.duckdns.org
    server {
        listen 443 ssl;
        server_name dev.bbangpatrol.duckdns.org;

        ssl_certificate     /etc/letsencrypt/live/dev.bbangpatrol.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dev.bbangpatrol.duckdns.org/privkey.pem;

        client_max_body_size 70M;

        location / {
            proxy_pass http://bbang_dev;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
