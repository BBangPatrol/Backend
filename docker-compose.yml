services:
  backend:
    # CI 가 러너에서 빌드해 GHCR 로 올린 이미지를 받아 쓴다.
    # build 는 로컬에서 직접 띄울 때만 쓰인다 (docker compose up --build)
    image: ghcr.io/bbangpatrol/backend:latest
    build: .
    container_name: backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - REDIS_HOST=redis
      # 없으면 컨테이너가 UTC 로 돌아 LocalDateTime.now() 가 9시간 이르게 저장된다
      - TZ=Asia/Seoul
    depends_on:
      - redis
    # json-file 기본값은 무제한이라 20G 디스크가 로그로 찬다.
    # 영수증 OCR 원문까지 INFO 로 찍혀 한 건당 줄 수가 많다
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data: