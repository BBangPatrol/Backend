services:
  backend:
    # CI 가 러너에서 빌드해 GHCR 로 올린 이미지를 받아 쓴다.
    # build 는 로컬에서 직접 띄울 때만 쓰인다 (docker compose up --build)
    image: ghcr.io/bbangpatrol/backend:latest
    build: .
    container_name: backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - REDIS_HOST=redis
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    expose:
      - "6379"

volumes:
  redis-data: