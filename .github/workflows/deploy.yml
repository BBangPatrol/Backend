name: Deploy Backend to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/Backend
            git pull origin main
            docker compose down
            docker compose up -d --build
            sleep 15
            docker compose ps --filter "status=running" | grep -q backend
            curl -fsS https://localhost:8080/actuator/health || (docker compose logs --tail=50 backend; exit1)