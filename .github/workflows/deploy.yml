name: Deploy Backend to EC2

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # 이미지는 러너에서 만든다. EC2 에서 빌드하면 도커 빌드 캐시가 계속 쌓여
  # 20G 디스크가 배포 몇 번 만에 100% 가 되고, gradle 이 캐시 디렉터리를 못 만들어 실패한다.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # GHCR 은 소문자 경로만 받는다. BBangPatrol/Backend 를 그대로 쓰면 거부된다
      - name: 이미지 이름 계산
        id: meta
        run: echo "image=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: JDK 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 테스트
        run: |
          chmod +x ./gradlew
          ./gradlew test --no-daemon

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          # 캐시는 러너 쪽에 둔다. EC2 디스크와 무관하다
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd ~/Backend
            git pull origin main
            docker compose config -q

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull backend
            docker compose up -d
            docker logout ghcr.io

            echo "Waiting for backend to be healthy..."
            for i in $(seq 1 20); do
              if curl -fsS http://localhost:8080/actuator/health > /dev/null 2>&1; then
                echo "Backend is up!"
                # 직전 배포 이미지는 롤백용으로 남기고 그보다 오래된 것만 정리한다
                docker image prune -af --filter "until=72h" || true
                exit 0
              fi
              echo "Not ready yet ($i/20), retrying in 3s..."
              sleep 3
            done

            echo "Backend failed to become healthy"
            docker compose logs --tail=100 backend
            exit 1
