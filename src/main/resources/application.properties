spring.application.name=BbangPatrol

##### -----Database start-----
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT}
##### -----Database end-----

##### -----Flyway start-----
## 스키마/시드는 db/migration 의 V{n}__*.sql 이 단독 관리한다.
## 앱 부팅 시 Hibernate validate 보다 먼저 실행됨.
## 주의: 비어있지 않은데 flyway_schema_history 가 없는 DB 에서는 의도적으로 실패한다
##       (기존 DB 를 덮어쓰지 않기 위함). 그 경우 DB 를 비우고 다시 띄울 것.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
##### -----Flyway end-----

##### -----JWT start-----
jwt.secret=${JWT_SECRET}
## 18000000 = 300min, 86400000 = 1Day
jwt.access-token-expiration=86400000
## 604800000 = 7Days
jwt.refresh-token-expiration=604800000
##### -----JWT end-----

##### -----Kakao start-----
kakao.client-id=${KAKAO_CLIENT_ID}
kakao.redirect-uri=${KAKAO_REDIRECT_URI}
kakao.client.secret=${KAKAO_CLIENT_SECRET}
##### -----Kakao end-----

##### -----TourAPI start-----
tourapi.service-key=${TOUR_API_SERVICE_KEY}
##### -----TourAPI end-----

##### -----Cloudflare R2 start-----
cloudflare.r2.account-id=${R2_ACCOUNT_ID}
cloudflare.r2.access-key=${R2_ACCESS_KEY_ID}
cloudflare.r2.secret-key=${R2_SECRET_ACCESS_KEY}
cloudflare.r2.bucket-name=${R2_BUCKET_NAME}
cloudflare.r2.public-base-url=${R2_PUBLIC_BASE_URL:}
##### -----Cloudflare R2 end-----

## Redis refresh token
REFRESH_TOKEN_EXPIRED_TIME=7

##### -----Actuator start-----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
##### -----Actuator end-----

##### -----FastAPI start-----
ocr.base-url=${OCR_BASE_URL:http://localhost:8000}
ocr.connect-timeout=5s
ocr.read-timeout=60s
##### -----FastAPI end-----

##### -----Gemini start-----
gemini.model=${GEMINI_MODEL}
gemini.api-key=${GEMINI_API_KEY}
##### -----Gemini end-----

##### -----Receipt verification start -----
receipt.verification-secret=${RECEIPT_VERIFICATION_SECRET}
##### -----Receipt verification end -----

##### -----Cors start -----
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:5173,https://*.vercel.app}
##### -----Cors end -----